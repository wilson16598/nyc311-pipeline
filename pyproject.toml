[project]
name = "nyc311-pipeline"
version = "0.1.0"
description = "Big Data pipeline for NYC 311 Service Requests using ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.31.0",
    "types-tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
