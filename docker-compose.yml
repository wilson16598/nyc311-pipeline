version: "3.8"

services:
  clickhouse-01:
    image: clickhouse/clickhouse-server:24.2
    container_name: clickhouse-01
    hostname: clickhouse-01
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse-01-data:/var/lib/clickhouse
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    environment:
      CLICKHOUSE_DB: nyc311
      CLICKHOUSE_USER: pipeline_user
      CLICKHOUSE_PASSWORD: pipeline_pass_2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - ch-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-02:
    image: clickhouse/clickhouse-server:24.2
    container_name: clickhouse-02
    hostname: clickhouse-02
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-02-data:/var/lib/clickhouse
      
    environment:
      CLICKHOUSE_DB: nyc311
      CLICKHOUSE_USER: pipeline_user
      CLICKHOUSE_PASSWORD: pipeline_pass_2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - ch-network
    depends_on:
      clickhouse-01:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    volumes:
      - zookeeper-data:/data
      - zookeeper-log:/datalog
    networks:
      - ch-network

networks:
  ch-network:
    driver: bridge

volumes:
  clickhouse-01-data:
  clickhouse-02-data:
  zookeeper-data:
  zookeeper-log:
